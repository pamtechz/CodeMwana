name: Apply CodeMwana 3.0 upgrade

on:
  push:
    paths:
      - '.upgrade/**'

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and validate CodeMwana 3.0
        shell: bash
        run: |
          set -euo pipefail
          cat .upgrade/part-* > /tmp/codemwana-v3.b64
          echo "13ba6a53dfb5f681f6dc07190a0922f5f8e98b3549a6d0ab2f394f48bcb39ab2  /tmp/codemwana-v3.b64" | sha256sum --check -
          base64 --decode /tmp/codemwana-v3.b64 > /tmp/codemwana-v3.tar.xz
          echo "2885088ce20a009480fe3b1c7b3e55896cbbbd80b064f656f4faa88809c293a4  /tmp/codemwana-v3.tar.xz" | sha256sum --check -
          tar -xJf /tmp/codemwana-v3.tar.xz -C .
          rm -rf .upgrade .github/workflows/apply-codemwana-v3.yml
          php tests/smoke.php
          python3 - <<'PY'
          import sqlite3
          schema = open('database/schema_sqlite.sql').read()
          conn = sqlite3.connect(':memory:')
          conn.executescript(schema)
          assert conn.execute("select count(*) from sqlite_master where type='table' and name='programming_languages'").fetchone()[0] == 1
          print('SQLite schema validation passed')
          PY

      - name: Commit the production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade responsive UI and multi-language Code Lab"
          git push origin HEAD:main
